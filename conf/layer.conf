BBFILES += "${LAYERDIR}/recipes/*/*.bb ${LAYERDIR}/recipes/*/*.bbappend ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-products/images/*.bbappend"
BBPATH .= ":${LAYERDIR}"
BBFILE_COLLECTIONS += "location"
BBFILE_PRIORITY_location = "12"
BBFILE_PATTERN_location := "^${LAYERDIR}/"

LAYERVERSION_location = "1"
LAYERSERIES_COMPAT_location = "${LAYERSERIES_COMPAT_core}"

LAYERDEPENDS_location = " \
    qti-bsp \
    qti-core \
    msm-data \
    qti-sepolicy \
"
LAYERDEPENDS_location += "${@oe.utils.conditional('DISTRO', 'auto', 'auto-sepolicy', '', d)}"

LAYERRECOMMENDS_location = " \
    location-prop \
    location-internal \
"