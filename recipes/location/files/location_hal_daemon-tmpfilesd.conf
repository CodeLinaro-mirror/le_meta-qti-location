## SOCKET directory - /dev/socket
# Create directory in /dev/socket for location with required permissions
d /dev/socket/loc_client 0775 gps locclient - -
# Create internal directories
d /dev/socket/location/ehub 0755 gps gps - -
# selinux context will be set in location.fc file

## DATA directory - /data/vendor/location
# Create internal directories
d /data/vendor/location/extap_locclient 0755 gps gps - -
# selinux context will be set in location.fc file
